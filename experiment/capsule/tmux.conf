# tmux only provides a terminal for the interactive Claude Code session and a
# read-only view of it for the operator.
set -g default-terminal "tmux-256color"
set -g default-size 200x50
set -g window-size latest
set -g status off
set -g history-limit 200000
set -g escape-time 0
set -g mouse off
set -g focus-events on
