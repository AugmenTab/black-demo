schema_version = 1

[routing.planner]
provider = "claude"
model = "claude-opus-5-5"
effort = "medium"
billing_mode = "subscription_only"

[routing.implementer]
provider = "claude"
model = "claude-opus-5-5"
effort = "medium"
billing_mode = "subscription_only"

[routing.reviewer]
provider = "claude"
model = "claude-opus-5-5"
effort = "medium"
billing_mode = "subscription_only"

[execution]
baseline_argv = [
  "docker",
  "compose",
  "run",
  "--rm",
  "dev",
  "bash",
  "-lc",
  'cd /workspace && npm ci >/dev/null && npm run build >/dev/null && p="$1" && node --test "dist/${p%.ts}.js"',
  "--"
]

planner_quality_argv = [
  "docker",
  "compose",
  "run",
  "--rm",
  "dev",
  "bash",
  "-lc",
  "cd /workspace && npm ci && npm run build"
]

agent_timeout_seconds = 900.0
command_timeout_seconds = 600.0

phase_gate_commands = [
  [
    "docker",
    "compose",
    "run",
    "--rm",
    "dev",
    "bash",
    "-lc",
    "cd /workspace && npm ci && npm test"
  ]
]

verification_prefix_argv = [
  "docker",
  "compose",
  "run",
  "--rm",
  "dev"
]
